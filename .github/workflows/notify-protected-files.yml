name: Notify Protected Files Change

on:
  push:
    branches: [ main ]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Scarica gli ultimi 2 commit per fare il confronto

      - name: Controlla se i file protetti sono stati modificati
        id: check_files
        run: |
          # Sostituisci con i percorsi reali dei tuoi 3 file
          FILES_PATTERN="^turbogetto\.mat$|^ramjet\.mat$"
          
          # Ottieni la lista dei file modificati nell'ultimo push
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E "$FILES_PATTERN" || true)
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
            echo "File modificati: $CHANGED_FILES"
          else
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          fi

      # OPZIONE A: Fai fallire la Build (riceverai una mail automatica da GitHub)
      - name: Allarme File Modificati
        if: steps.check_files.outputs.CHANGED == 'true'
        run: |
          echo "ATTENZIONE: Uno o più file protetti sono stati modificati da ${{ github.actor }}!"
          exit 1 # Fa fallire la run dell'Action, scatenando la mail di notifica di GitHub
